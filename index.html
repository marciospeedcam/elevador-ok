<style>

main{padding:14px 14px 20px; max-width:720px; margin:0 auto}
h2{font-size:19px;margin:18px 0 10px;font-weight:650}

h3{font-size:15px;margin:16px 0 8px;font-weight:650;color:var(--ink2)}

a.card,button.card{display:block;width:100%;text-align:left;cursor:pointer;color:inherit;text-decoration:none;font:inherit}
.row{display:flex;gap:10px;align-items:center}

.pill.verde{background:var(--oksoft);color:var(--ok)}

}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
#sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,14,20,.5);
  display:flex;align-items:flex-end;justify-content:center;
}
#sheet.hide{display:none}
#sheet .inner{
  background:var(--card);width:100%;max-width:720px;border-radius:18px 18px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;
}
#sheet h3{margin-top:0;color:var(--ink);font-size:17px}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom));
  z-index:99;background:#111827;color:#fff;padding:11px 16px;border-radius:12px;
  font-size:14px;font-weight:600;max-width:88%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3);
}
#toast.hide{display:none}
.loading{text-align:center;padding:50px 16px;color:var(--ink3)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
details.mais{border:1px solid var(--line);border-radius:12px;margin-top:14px;background:var(--bg)}
@media (prefers-color-scheme: dark){details.mais{background:#0b0e13}}
details.mais>summary{padding:12px;font-size:14px;font-weight:650;color:var(--brand);cursor:pointer;list-style:none}
details.mais>summary::-webkit-details-marker{display:none}
details.mais>summary::after{content:" \25BE";font-size:11px}
details.mais[open]>summary::after{content:" \25B4"}
.maisin{padding:0 12px 12px}
.maisin label:first-child{margin-top:4px}
.trilha{display:flex;gap:6px;margin-top:11px}
.trilha button{flex:1;border:0;border-radius:999px;padding:9px 4px;font:inherit;font-size:12px;font-weight:650;background:var(--neutralsoft);color:var(--ink3)}
.trilha button.feito{background:var(--oksoft);color:var(--ok)}
.trilha button.agora{background:var(--brand);color:#fff}
@media (prefers-color-scheme: dark){.trilha button.agora{color:#0e1116}}
.trilha button[disabled]{opacity:1}
.qrbox{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:12px;margin:10px 0}
.qrbox canvas,.qrbox img{max-width:210px;height:auto;display:block}
</style>

<script>
"use strict";
var FB_CONFIG={apiKey:"AIzaSyDbI-3Z_2z1qO0bXBotTxhl_ZzyraKZ2xA",authDomain:"elevador-ok.firebaseapp.com",projectId:"elevador-ok",storageBucket:"elevador-ok.firebasestorage.app",messagingSenderId:"476899431754",appId:"1:476899431754:web:1e0b0df448541fcbbe1db3"};
var DONO_EMAIL="marciomusicadia@gmail.com";

var auth=null, conta=null, carregouAuth=false, fotoCache={};
/* ---------------- estado ---------------- */
var db=null, user=null, assets=true, uid=null, isOwner=false, canWrite=true;
var D={config:null, usuarios:[], clientes:[], elevadores:[], chamados:[]};
var ready={usuarios:false, clientes:false, elevadores:false, chamados:false, config:false};
var me=null;            // doc do usuario logado
var verComo=null;       // empresa pode simular perfil
var route={s:"", id:""};
var timerH=null;

/* ---------------- utilidades ---------------- */
function $(s,r){return (r||document).querySelector(s);}
function el(t,c,x){var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m];});}
function uuid(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function codigoNovo(){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="";for(var i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.remove("hide");clearTimeout(toast._h);toast._h=setTimeout(function(){t.classList.add("hide");},2600);}
function money(v){var n=Number(v);if(!isFinite(n))return "—";return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function dnum(v){var n=String(v==null?"":v).replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",",".");return Number(n);}
function dt(ts){if(!ts)return "—";var d=new Date(ts);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}
function dia(ts){if(!ts)return "—";var d=new Date(ts);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});}
function hoje(){var d=new Date();return d.toISOString().slice(0,10);}
function addMeses(iso,m){if(!iso)return null;var d=new Date(iso+"T12:00:00");d.setMonth(d.getMonth()+Number(m||0));return d.toISOString().slice(0,10);}
function diasAte(iso){if(!iso)return null;var a=new Date(iso+"T12:00:00"),b=new Date();b.setHours(12,0,0,0);return Math.round((a-b)/86400000);}
function dur(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");}
function durTexto(min){min=Math.round(Number(min)||0);var h=Math.floor(min/60),m=min%60;
  return h? (h+"h"+(m?" "+m+"min":"")) : (m+"min");}
function dist(a,b,c,d){ // metros
  if(a==null||b==null||c==null||d==null)return null;
  var R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p;
  var q=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)*Math.sin(y/2);
  return Math.round(R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q)));
}
function gps(){
  return new Promise(function(res){
    if(!navigator.geolocation)return res(null);
    navigator.geolocation.getCurrentPosition(
      function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)});},
      function(){res(null);},
      {enableHighAccuracy:true,timeout:12000,maximumAge:0});
  });
}

/* ---------------- camada de dados ---------------- */
function norm(res){
  if(!res)return [];
  var arr = Array.isArray(res)?res:(res.docs||res.items||res.data||[]);
  if(!Array.isArray(arr))return [];
  return arr.map(function(d){
    if(d&&typeof d==="object"&&("id" in d)&&("data" in d)){
      var v=(typeof d.data==="function")?d.data():d.data;
      var o=Object.assign({},v||{}); o.id=d.id; return o;
    }
    return d;
  }).filter(Boolean);
}
function one(snap){
  if(!snap)return null;
  if(typeof snap.data==="function"){ if(snap.exists===false)return null; return snap.data()||null; }
  if("exists" in snap && !snap.exists) return null;
  if("data" in snap) return snap.data||null;
  return snap;
}
function watchColl(path,cb){
  var done=false;
  try{
    var c=db.collection(path);
    if(c&&typeof c.onSnapshot==="function"){ c.onSnapshot(function(r){done=true;cb(norm(r));}); }
  }catch(e){}
  var tick=function(){ db.collection(path).get().then(function(r){cb(norm(r));}).catch(function(){cb([]);}); };
  tick();
  setInterval(function(){ if(!done) tick(); },10000);
}
function watchDoc(path,cb){
  var done=false;
  try{
    var d=db.doc(path);
    if(d&&typeof d.onSnapshot==="function"){ d.onSnapshot(function(s){done=true;cb(one(s));}); }
  }catch(e){}
  var tick=function(){ db.doc(path).get().then(function(s){cb(one(s));}).catch(function(){cb(null);}); };
  tick();
  setInterval(function(){ if(!done) tick(); },15000);
}
function save(path,obj){
  if(!db)return Promise.reject(new Error("sem banco"));
  return db.doc(path).set(obj).catch(function(e){
    toast("Não deu pra salvar. Tente de novo.");
    throw e;
  });
}
function upChamado(c,extra,log){
  var o=Object.assign({},c,extra||{});
  o.hist=(c.hist||[]).slice();
  var ent=log?{ts:Date.now(),quem:papel(),texto:log}:null;
  if(ent) o.hist.push(ent);
  o.atualizado=Date.now();
  var i=D.chamados.findIndex(function(x){return x.id===o.id;});
  if(i>=0)D.chamados[i]=o; else D.chamados.push(o);
  render();
  var up=Object.assign({},extra||{},{atualizado:o.atualizado});
  try{ if(ent) up.hist=firebase.firestore.FieldValue.arrayUnion(ent); }catch(e){ up.hist=o.hist; }
  return db.doc("chamados/"+o.id).update(up).catch(function(){
    return save("chamados/"+o.id,o);
  });
}

/* ---------------- papeis ---------------- */
function papel(){
  if(verComo) return verComo;
  if(isOwner) return "empresa";
  return (me&&me.perfil)||"";
}
function aprovado(){ return isOwner || (me&&me.aprovado===true); }
function nome(u){ if(!u)return "—"; return u.nome||"Sem nome"; }
function usuario(id){ return D.usuarios.find(function(u){return u.id===id;})||null; }
function cliente(id){ return D.clientes.find(function(c){return c.id===id;})||null; }
function elevador(id){ return D.elevadores.find(function(e){return e.id===id;})||null; }
function chamado(id){ return D.chamados.find(function(c){return c.id===id;})||null; }
function tecnicos(){ return D.usuarios.filter(function(u){return u.perfil==="tecnico"&&u.aprovado;}); }
function meusElevadores(){
  var p=papel();
  if(p==="empresa")return D.elevadores;
  if(p==="tecnico")return D.elevadores.filter(function(e){return e.tecnicoUid===uid;});
  var ids=(me&&me.clienteIds)||[];
  return D.elevadores.filter(function(e){return ids.indexOf(e.clienteId)>=0;});
}
function meusChamados(){
  var p=papel();
  var cs=D.chamados.slice().sort(function(a,b){return (b.criado||0)-(a.criado||0);});
  if(p==="empresa")return cs;
  if(p==="tecnico")return cs.filter(function(c){return c.tecnicoUid===uid;});
  var ids=(me&&me.clienteIds)||[];
  return cs.filter(function(c){return ids.indexOf(c.clienteId)>=0;});
}

/* ---------------- status ---------------- */
var STATUS={
  aberto:{l:"Aberto",c:"azul"},
  designado:{l:"Técnico designado",c:"azul"},
  agendado:{l:"Visita agendada",c:"azul"},
  nao_compareceu:{l:"Não compareceu",c:"vermelho"},
  em_atendimento:{l:"Em atendimento",c:"verde"},
  aguardando_orcamento:{l:"Aguardando orçamento",c:"amarelo"},
  aguardando_peca:{l:"Aguardando peça",c:"amarelo"},
  peca_chegou:{l:"Peça chegou",c:"verde"},
  concluido:{l:"Concluído",c:"verde"},
  aguardando_pagamento:{l:"Aguardando pagamento",c:"amarelo"},
  pago:{l:"Pago",c:"cinza"}
};
function stPill(s){var x=STATUS[s]||{l:s||"—",c:"cinza"};var e=el("span","pill "+x.c,x.l);return e;}
function atrasado(c){
  if(!c.agendamento)return false;
  if(c.checkin)return false;
  if(["concluido","aguardando_pagamento","pago"].indexOf(c.status)>=0)return false;
  return new Date(c.agendamento).getTime() < Date.now()-3*3600000;
}

/* ---------------- manutenção periódica ---------------- */
function proximaManut(e){
  if(!e||!e.ultimaManut)return null;
  return addMeses(e.ultimaManut, e.validadeMeses||12);
}
function manutStatus(e){
  var p=proximaManut(e);
  if(!p)return {txt:"Sem data de manutenção",c:"cinza",d:null,prox:null};
  var d=diasAte(p), av=Number(e.avisoDias||30);
  if(d<0)return {txt:"Vencida há "+Math.abs(d)+" dia"+(Math.abs(d)===1?"":"s"),c:"vermelho",d:d,prox:p};

function picker(onFile,galeria){
  var i=document.createElement("input");
  i.type="file"; i.accept="image/*"; if(!galeria) i.setAttribute("capture","environment");
  i.style.display="none";
  i.onchange=function(){ if(i.files&&i.files[0]) onFile(i.files[0]); };
  document.body.appendChild(i); i.click();
  setTimeout(function(){ i.remove(); },60000);
}
function comprimir(file){
  return new Promise(function(res,rej){
    var im=new Image(), u=URL.createObjectURL(file);
    im.onload=function(){
      var mx=1000, w=im.width, h=im.height, k=Math.min(1,mx/Math.max(w,h));
      var cv=document.createElement("canvas"); cv.width=Math.round(w*k); cv.height=Math.round(h*k);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      URL.revokeObjectURL(u);
      var q=0.62, d=cv.toDataURL("image/jpeg",q);
      while(d.length>700000&&q>0.25){ q-=0.12; d=cv.toDataURL("image/jpeg",q); }
      res(d);
    };
    im.onerror=function(){ URL.revokeObjectURL(u); rej(new Error("imagem")); };
    im.src=u;
  });
}
function subirFoto(file){
  return comprimir(file).then(function(d){
    var id=uuid(); fotoCache[id]=d;
    return db.doc("fotos/"+id).set({d:d,ts:Date.now(),quem:uid}).then(function(){ return id; });
  });
}
function setFoto(im,id){

  db.doc("fotos/"+id).get().then(function(sn){ var v=one(sn); if(v&&v.d){ fotoCache[id]=v.d; im.src=v.d; } }).catch(function(){});
}

/* ---------------- lista de chamados ---------------- */
var filtroCh="abertos";
function telaChamados(app){
  var p=papel();
  pintaTopo(p==="tecnico"?"Meus serviços":"Chamados", null);
  var cs=meusChamados();
  var tabs=el("div","tabs");
  [["abertos","Em andamento"],["todos","Todos"],["peca","Aguardando peça"],["concluidos","Concluídos"]].forEach(function(x){
    var b=el("button",filtroCh===x[0]?"on":"",x[1]);
    b.onclick=function(){ filtroCh=x[0]; render(); };
    tabs.appendChild(b);
  });
  app.appendChild(tabs);
  var lista=cs.filter(function(c){
    if(filtroCh==="todos")return true;
    if(filtroCh==="peca")return ["aguardando_peca","peca_chegou"].indexOf(c.status)>=0;
    if(filtroCh==="concluidos")return ["concluido","aguardando_pagamento","pago"].indexOf(c.status)>=0;
    return ["concluido","pago"].indexOf(c.status)<0;
  });
  if(!lista.length) vazio(app,"Nada aqui por enquanto.",'<path d="M4 6h16M4 12h16M4 18h10"/>');
  lista.forEach(function(c){ app.appendChild(cardChamado(c)); });
  if(p==="empresa"||p==="cliente"){
    var b=el("button","btn","Abrir novo chamado");
    b.onclick=function(){ go("novo"); };

  }
}

  if(p==="tecnico"&&c.tecnicoUid===uid&&c.checkin){

  /* orçamento ao cliente */
  if(p!=="tecnico"&&(c.orcamento||p==="empresa")){

      r.appendChild(vw);

      }
      if(p==="empresa"&&stCob!=="pago"){
        if(stCob==="analise") cc.appendChild(el("div","banner info","O cliente enviou o comprovante. Confira e aprove."));
        var bp=el("button","btn ok",temComp?"Aprovar pagamento":"Aguardando o comprovante do cliente");
        bp.disabled=!temComp;

            upChamado(c,{cobranca:o,fotos:fs,status:"aguardando_pagamento"},"Empresa recusou o comprovante");

  if(p==="tecnico"&&c.tecnicoUid===uid){

      hc.appendChild(r);
    });
    app.appendChild(hc);
  }
}
function temPecaPendente(c){ return (c.pecas||[]).some(function(p){return p.status!=="instalada"&&p.status!=="chegou";}); }
function copiar(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast("Copiado!");},function(){toast(txt);});
  } else toast(txt);
}

function garantirCliente(u){
  var ids=(u.clienteIds||[]).filter(function(i){return !!cliente(i);});
  if(ids.length) return ids[0];
  var id=uuid();
  var c={id:id,nome:u.razao||u.nome||"Cliente",cnpj:u.cnpj||u.cpf||"",endereco:"",cep:"",bairro:"",
    responsavel:u.nome||"",telefone:u.telefone||"",garantiaTipo:"nenhuma",garantiaPecas:"",criado:Date.now(),donoUid:u.id};
  D.clientes.push(c); save("clientes/"+id,c);
  var o=Object.assign({},u,{clienteIds:ids.concat([id])});
  var j=D.usuarios.findIndex(function(x){return x.id===u.id;}); if(j>=0)D.usuarios[j]=o;
  save("usuarios/"+u.id,o);
  return id;
}

  var c=el("div","card");
  c.appendChild(el("div","small","Conectado como "+((conta&&conta.email)||"")));
  c.appendChild(el("div","small","Vers\u00e3o "+VERSAO));
  var b=el("button","btn gray","Sair da conta");
  b.onclick=function(){ auth.signOut().then(function(){ location.reload(); }); };
  c.appendChild(b); pai.appendChild(c);
}
function sheetMeusDados(){
  sheet("Meus dados",function(p,close){
    var nm=campo(p,"Nome","text",me.nome||"");
    var te=campo(p,"Telefone","tel",me.telefone||"");
    var px=campo(p,"Chave Pix","text",me.pix||"");
    var bc=campo(p,"Banco e conta","text",me.banco||"");
    var b=el("button","btn","Salvar");
    b.onclick=function(){
      var o=Object.assign({},me,{nome:nm.value.trim(),telefone:te.value.trim(),pix:px.value.trim(),banco:bc.value.trim()});
      me=o;
      var i=D.usuarios.findIndex(function(x){return x.id===o.id;}); if(i>=0)D.usuarios[i]=o;
      close(); save("usuarios/"+o.id,o); render(); toast("Salvo");
    };
    p.appendChild(b);
  });
}

/* ---------------- início ---------------- */
var tempoLimite=setTimeout(function(){
  if(!ready.usuarios) render();
},11000);

var vigiando=false;
function vigiar(){
  if(vigiando)return; vigiando=true;
  watchDoc("config/app",function(v){
    D.config=v||D.config||{}; ready.config=true;
    render();
  });
  watchColl("usuarios",function(v){
    D.usuarios=v; ready.usuarios=true;
    me=D.usuarios.find(function(u){return u.id===uid;})||null;
    if(isOwner&&!me){ me={id:uid,nome:(D.config&&D.config.empresa)||"Empresa",perfil:"empresa",aprovado:true}; }
    render();
  });
  watchColl("clientes",function(v){ D.clientes=v; ready.clientes=true; render(); });
  watchColl("elevadores",function(v){ D.elevadores=v; ready.elevadores=true; render(); });
  watchColl("chamados",function(v){ D.chamados=v; ready.chamados=true; render(); });
}
function boot(){
  var h=lerHash(); if(h)route=h;
  try{
    firebase.initializeApp(FB_CONFIG);
    db=firebase.firestore();
    try{ db.settings({ignoreUndefinedProperties:true}); }catch(e){}
    auth=firebase.auth();
  }catch(e){
    $("#app").innerHTML='<div class="card"><h2>Sem conex\u00e3o</h2><p class="muted">N\u00e3o consegui carregar o app. Confira a internet e recarregue a p\u00e1gina.</p></div>';
    return;
  }
  auth.onAuthStateChanged(function(u){
    carregouAuth=true; conta=u||null;
    if(!u){ uid=null; render(); return; }
    uid=u.uid;
    isOwner = String(u.email||"").toLowerCase()===DONO_EMAIL;
    render(); vigiar();
  });
}
try{ if("serviceWorker" in navigator) window.addEventListener("load",function(){ navigator.serviceWorker.register("./sw.js").catch(function(){}); }); }catch(e){}
function checarVersao(){
  try{
    fetch("./versao.txt?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).then(function(t){
      t=String(t||"").trim();
      if(!t||t===VERSAO)return;
      var ja=null; try{ ja=sessionStorage.getItem("elv_v"); }catch(e){}
      if(ja===t)return;
      try{ sessionStorage.setItem("elv_v",t); }catch(e){}
      location.replace(location.pathname+"?v="+encodeURIComponent(t)+location.hash);
    }).catch(function(){});
  }catch(e){}
}
checarVersao(); setInterval(checarVersao,180000);
function recarregarDados(){
  if(!db||!uid||!vigiando)return;
  [["chamados","chamados"],["elevadores","elevadores"],["clientes","clientes"],["usuarios","usuarios"]].forEach(function(x){
    db.collection(x[0]).get({source:"server"}).then(function(r){
      var novo=norm(r), mudou=true;
      try{ mudou=JSON.stringify(novo)!==JSON.stringify(D[x[1]]); }catch(e){}
      if(!mudou)return;
      D[x[1]]=novo;
      if(x[1]==="usuarios"){ var m=D.usuarios.find(function(u){return u.id===uid;}); if(m)me=m; }
      render();
    }).catch(function(){});
  });
}
document.addEventListener("visibilitychange",function(){ if(!document.hidden){ checarVersao(); recarregarDados(); } });
window.addEventListener("focus",recarregarDados);
window.addEventListener("online",recarregarDados);
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
</script>
</body>
